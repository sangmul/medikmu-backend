# Single-VPS production stack: Caddy (auto HTTPS) -> api -> Postgres/Redis.
# Run on the server:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# See docs/deployment.md.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://medikmu:${POSTGRES_PASSWORD}@db:5432/medikmu?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikmu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medikmu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikmu"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
