# Local development: `make up`  (API + Postgres + Redis)
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://medikmu:medikmu@db:5432/medikmu?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Applies pending migrations on every `make up`, then exits.
  migrate:
    image: migrate/migrate:v4.18.1
    command:
      - "-path=/migrations"
      - "-database=postgres://medikmu:medikmu@db:5432/medikmu?sslmode=disable"
      - "up"
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # Public HTTPS URL for the mobile and web apps during development.
  # Opt in with `make tunnel` (needs NGROK_AUTHTOKEN and NGROK_DOMAIN in .env). See docs/dev-ngrok.md.
  ngrok:
    profiles: ["tunnel"]
    image: ngrok/ngrok:3
    # Compose resolves ${...} even when this profile is off, so no `:?` here: `make tunnel` checks the values.
    command: ["http", "api:8080", "--url=${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040" # ngrok inspector: replay and inspect requests
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medikmu
      POSTGRES_PASSWORD: medikmu
      POSTGRES_DB: medikmu
    ports:
      - "127.0.0.1:5432:5432" # localhost only: the password is a known dev value
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikmu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # localhost only: Redis has no password in dev

  # Object storage (lab files, PDFs) is not here yet: no module uses it. MinIO was removed because its images
  # are no longer pullable (minio/minio on Docker Hub and quay.io/minio/minio both refuse anonymous pulls).
  # Pick an S3-compatible store when the `files` module is built (docs/architecture.md).

volumes:
  pgdata:
