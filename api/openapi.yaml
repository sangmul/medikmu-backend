openapi: 3.0.3
info:
  title: Medikmu API
  version: 0.1.0
  description: |
    Backend for the Medikmu mobile app (patients) and web app (doctors, clinics, hospitals).
    This file is the source of truth: change it first, then implement. See docs/api-conventions.md.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://{domain}/api/v1
    description: Development tunnel (ngrok); see docs/dev-ngrok.md
    variables:
      domain:
        default: your-name.ngrok-free.app
tags:
  - name: auth
  - name: me
  - name: patients
  - name: facilities
  - name: team
  - name: family
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a patient account and sign in
      description: |
        Creates a user (a patient by default) and returns tokens. Staff are attached to facilities
        through invites, not through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          description: Email or phone already registered (`email_taken`, `phone_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed; `error.details` maps field name to reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session the refresh token belongs to
      description: Idempotent. Unknown tokens are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out
  /auth/switch-facility:
    post:
      tags: [auth]
      operationId: switchFacility
      summary: Change the active facility of the session
      description: |
        Rotates the refresh token and returns tokens scoped to the chosen facility.
        An empty `facility_id` switches to the personal (patient) context.
        A rejected switch (403) does not consume the refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchFacilityRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        If the user belongs to exactly one facility it becomes the active facility;
        otherwise call `/auth/switch-facility`. Wrong password and unknown email return the same error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user and memberships
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
  /patients:
    get:
      tags: [patients]
      operationId: listPatients
      summary: List patients of the active facility (web)
      description: |
        Newest first, cursor-paginated. NIK is masked and clinical fields are omitted in the list;
        fetch one patient for the full record. Requires an active facility (any staff role).
        Every call is audited.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search by name, phone or medical record number
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientPage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [patients]
      operationId: createPatient
      summary: Register a patient at the active facility
      description: |
        Roles: admin, doctor, nurse, staff. `consent` must be true. The MRN (`RM-000001`, per facility)
        is assigned by the server. Patients under 18 need `guardian_name`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientCreateRequest"
      responses:
        "201":
          description: Created. `Location` points to the new patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: NIK already registered at this facility (`nik_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation failed; `error.details` maps field name to reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [patients]
      operationId: getPatient
      summary: Full patient record
      description: Any staff role of the facility. Audited. A patient of another facility returns 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [patients]
      operationId: updatePatient
      summary: Replace the editable fields of a patient
      description: |
        Roles: admin, doctor, nurse, staff. Full replacement of the fields below; `consent`, MRN and
        facility cannot be changed (unknown fields are rejected with 400).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientInput"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      tags: [patients]
      operationId: archivePatient
      summary: Archive a patient (admin only)
      description: Hides the patient from active lists; the record is kept. Its NIK can be registered again.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Archived
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /me/profile:
    put:
      tags: [me]
      operationId: updateProfile
      summary: Change the signed-in user's name and phone
      description: |
        Email is not editable here. An empty `phone` clears it. Changing the phone resets `phone_verified`
        (OTP verification is not built yet, so it is always false for now). A phone used by another account
        gives `phone_taken` (409).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, maxLength: 120 }
                phone: { type: string, description: 9-15 digits; a leading + is kept }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /family-members:
    get:
      tags: [family]
      operationId: listFamilyMembers
      summary: The signed-in account's family members (mobile)
      description: Scoped to the account, not to a facility. Another account's members are never visible.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [family]
      operationId: createFamilyMember
      summary: Add a family member (max 20 per account)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: "`nik_taken` (NIK already on this account) or `family_limit`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/Error"
  /family-members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [family]
      operationId: getFamilyMember
      summary: One family member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [family]
      operationId: updateFamilyMember
      summary: Replace a family member's fields (an omitted `bpjs` removes the card)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      tags: [family]
      operationId: deleteFamilyMember
      summary: Remove a family member
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /family-members/{id}/nik:
    put:
      tags: [family]
      operationId: setFamilyMemberNik
      summary: Save only the NIK of a family member
      description: 16 digits; spaces and dashes are ignored. A NIK can appear once per account (`nik_taken`, 409).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nik]
              properties:
                nik: { type: string }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMember"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /facilities:
    post:
      tags: [facilities]
      operationId: createFacility
      summary: Create a facility; the caller becomes its admin
      description: |
        Any signed-in account can start a solo practice, clinic or hospital. No active facility is needed.
        Afterwards call `/auth/switch-facility` with the new `id` to work inside it.
        An account may create at most 5 facilities (`facility_limit`, 409).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /facilities/current:
    get:
      tags: [facilities]
      operationId: getCurrentFacility
      summary: The active facility (any staff role)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    put:
      tags: [facilities]
      operationId: updateCurrentFacility
      summary: Edit the facility profile (admin only; kind cannot change)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityUpdateRequest"
      responses:
        "200":
          description: Updated facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /team:
    get:
      tags: [team]
      operationId: listTeam
      summary: Staff of the active facility (admin only; exposes emails)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /team/{userId}:
    delete:
      tags: [team]
      operationId: removeMember
      summary: Remove a staff member (admin only)
      description: |
        The last admin cannot be removed (`last_admin`, 409). The member's existing access token stays valid
        until it expires (15 min) but cannot be refreshed.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /invites:
    get:
      tags: [team]
      operationId: listInvites
      summary: Pending invites (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invites that are not accepted, revoked or expired. Tokens are never listed.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [team]
      operationId: createInvite
      summary: Invite someone to the facility (admin only)
      description: |
        Valid for 7 days. No email is sent: the response carries a one-time `token` that the admin shares with the
        invitee. Only its hash is stored. One pending invite per email (`invite_pending`, 409);
        inviting an existing member gives `already_member` (409).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /invites/{id}:
    delete:
      tags: [team]
      operationId: revokeInvite
      summary: Cancel a pending invite (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /invites/accept:
    post:
      tags: [team]
      operationId: acceptInvite
      summary: Join a facility with an invite token
      description: |
        The signed-in account's email must match the invite's email. Every failure (unknown, used, revoked,
        expired, other email) returns the same `invite_invalid` (400) so tokens cannot be probed.
        Afterwards call `/auth/switch-facility` with the returned `facility_id`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [facility_id, role]
                properties:
                  facility_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Already a member (`already_member`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: invalid_credentials }
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
              description: Present on validation errors (field name to reason)
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }
        full_name: { type: string, maxLength: 120 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    SwitchFacilityRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        facility_id:
          type: string
          format: uuid
          description: Omit or leave empty for the personal (patient) context
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds }
    Membership:
      type: object
      required: [facility_id, role]
      properties:
        facility_id: { type: string, format: uuid }
        role:
          type: string
          enum: [admin, doctor, nurse, pharmacist, finance, staff]
    Me:
      type: object
      required: [id, email, full_name, memberships]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        phone: { type: string }
        phone_verified: { type: boolean }
        full_name: { type: string }
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    Role:
      type: string
      enum: [admin, doctor, nurse, pharmacist, finance, staff]
    FamilyBpjs:
      type: object
      required: [number]
      properties:
        number: { type: string, description: 13 digits }
        holder_name: { type: string, maxLength: 120 }
        service_class: { type: integer, minimum: 1, maximum: 3 }
    FamilyMemberInput:
      type: object
      required: [full_name, relation, sex, birth_date]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        relation: { type: string, enum: [self, spouse, child, parent, sibling, other] }
        sex: { type: string, enum: [F, M] }
        birth_date: { type: string, format: date }
        nik: { type: string, description: 16 digits; optional }
        avatar_tone: { type: string, enum: [purple, blue, orange, teal], default: purple }
        bpjs: { $ref: "#/components/schemas/FamilyBpjs" }
    FamilyMember:
      type: object
      required: [id, full_name, relation, sex, birth_date, has_nik, avatar_tone, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        relation: { type: string, enum: [self, spouse, child, parent, sibling, other] }
        sex: { type: string, enum: [F, M] }
        birth_date: { type: string, format: date }
        nik: { type: string, description: The owner's own full NIK; responses are Cache-Control no-store }
        nik_masked: { type: string, example: 3174 **** **** 8901 }
        has_nik: { type: boolean }
        avatar_tone: { type: string, enum: [purple, blue, orange, teal] }
        bpjs:
          allOf:
            - $ref: "#/components/schemas/FamilyBpjs"
          nullable: true
          description: Whether the card is active needs BPJS integration and is not returned yet
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FacilityUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        phone: { type: string }
        address: { type: string, maxLength: 300 }
    FacilityCreateRequest:
      allOf:
        - $ref: "#/components/schemas/FacilityUpdateRequest"
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [solo_doctor, clinic, hospital] }
    Facility:
      type: object
      required: [id, name, kind, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [solo_doctor, clinic, hospital] }
        phone: { type: string }
        address: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      required: [user_id, full_name, email, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
    Invite:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CreatedInvite:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Shown once; share it with the invitee }
    PatientInput:
      type: object
      required: [full_name, sex, birth_date, phone, payment_type]
      properties:
        full_name: { type: string, minLength: 3, maxLength: 120 }
        sex: { type: string, enum: [F, M] }
        birth_date: { type: string, format: date }
        birth_place: { type: string, maxLength: 80 }
        nik: { type: string, description: 16 digits; spaces and dashes are ignored. Optional. }
        guardian_name: { type: string, description: Required for patients under 18 }
        guardian_relation: { type: string, maxLength: 40 }
        phone: { type: string, description: 9-15 digits; a leading + is kept }
        email: { type: string, format: email }
        address: { type: string, maxLength: 300 }
        payment_type: { type: string, enum: [bpjs, private, insurance] }
        bpjs_number: { type: string, description: 13 digits; only with payment_type bpjs }
        allergies:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        conditions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 2000 }
    PatientCreateRequest:
      allOf:
        - $ref: "#/components/schemas/PatientInput"
        - type: object
          required: [consent]
          properties:
            consent:
              type: boolean
              description: Patient or guardian consent to store the record. Must be true.
    Patient:
      allOf:
        - $ref: "#/components/schemas/PatientInput"
        - type: object
          required: [id, mrn, consent_at, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            mrn: { type: string, example: RM-000001 }
            consent_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PatientSummary:
      type: object
      required: [id, mrn, full_name, sex, birth_date, phone, payment_type, allergies]
      properties:
        id: { type: string, format: uuid }
        mrn: { type: string }
        full_name: { type: string }
        sex: { type: string, enum: [F, M] }
        birth_date: { type: string, format: date }
        nik_masked: { type: string, example: 3174 **** **** 8901 }
        guardian_name: { type: string }
        phone: { type: string }
        payment_type: { type: string, enum: [bpjs, private, insurance] }
        allergies:
          type: array
          items: { type: string }
    PatientPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PatientSummary"
        next_cursor:
          type: string
          nullable: true
